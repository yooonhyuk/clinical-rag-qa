action_codes:
  D: replace with a non-zero length value that may be a dummy value and consistent with the VR
  Z: replace with a zero length value, or a non-zero length value that may be a dummy value and consistent with the VR
  X: remove Attribute, and if the Attribute is a Sequence, remove all Sequence Items and their contained Attributes
  K: keep (unchanged for non-Sequence Attributes, cleaned for Sequences)
  C: clean, that is replace with values of similar meaning known not to contain identifying information and consistent with
    the VR
  U: replace with a non-zero length UID that is internally consistent within a set of Instances
  Z/D: Z unless D is required to maintain IOD conformance (Type 2 versus Type 1)
  X/Z: X unless Z is required to maintain IOD conformance (Type 3 versus Type 2)
  X/D: X unless D is required to maintain IOD conformance (Type 3 versus Type 1)
  X/Z/D: X unless Z or D is required to maintain IOD conformance (Type 3 versus Type 2 versus Type 1)
  X/Z/U*: X unless Z or replacement of contained instance UIDs (U) is required to maintain IOD conformance (Type 3 versus
    Type 2 versus Type 1 sequences containing UID references)
