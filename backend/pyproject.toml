[project]
name = "clinical-rag-qa"
version = "0.1.0"
description = "Local-first clinical document RAG + DICOM tag analyzer"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "pydicom>=2.4",
    "pyyaml>=6.0",
    "anthropic>=1.11.0",
    "pypdf>=6.0",
]

[project.optional-dependencies]
# B7 cross-encoder reranker (BAAI/bge-reranker-v2-m3). Not in the default api image:
# `uv sync --extra rerank` (torch is large). See docs/decisions/0004-reranker.md.
rerank = [
    "torch>=2.4",
    "transformers>=4.44",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "testcontainers[postgres]>=4.7",
    "ruff>=0.5",
    "pymupdf>=1.24",
]
ui = [
    "streamlit>=1.36",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
known-third-party = ["alembic"]
