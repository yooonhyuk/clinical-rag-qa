- id: k01
  lang: en
  topic: response-criteria
  source: RECIST 1.1 (Eisenhauer et al., Eur J Cancer 2009)
  question: "Under RECIST 1.1, partial response (PR) requires at least what decrease in the sum of diameters of target lesions, taking the baseline sum as reference?"
  options: {A: "10%", B: "20%", C: "30%", D: "50%"}
  answer: C

- id: k02
  lang: en
  topic: response-criteria
  source: RECIST 1.1
  question: "Under RECIST 1.1, progressive disease (PD) for target lesions requires which increase in the sum of diameters, taking the smallest sum on study (nadir) as reference?"
  options: {A: "At least 10% and an absolute increase of at least 3 mm", B: "At least 20% and an absolute increase of at least 5 mm", C: "At least 25% with no absolute requirement", D: "At least 30% and an absolute increase of at least 10 mm"}
  answer: B

