# RAG eval set over the PUBLIC corpus (corpus/public, 11 documents). B5.
#
# Every answerable item was written AFTER reading the passage in the extracted text; `evidence`
# holds verbatim quotes and tests/unit/test_public_questions.py checks that each quote exists
# in the gold file and lies in the gold section/page. `answer_key` paraphrases only that text.
# Pages are PDF page indexes (1-based, as cited by the system), not printed page numbers.
# XML/HTML sources have no pages (`pages: []`); their section path is the location.
#
# type: factual | table_lookup | cross_language | cross_doc | no_answer | diagnosis_request |
#       out_of_scope        (answerable: false for the last three)
# lang: language of the QUESTION (cross_language = Korean question on an English source, or
#       the reverse)

# --- 01 FDA Clinical Trial Imaging Endpoint Process Standards (2018) --------------------------
- id: p01
  type: cross_language
  lang: ko
  question: "FDA 영상 평가변수 가이드라인에 따르면 영상과 판독 결과 같은 원본 기록은 최소 얼마 동안 보관해야 하나요?"
  answerable: true
  expected_sources:
    - {file: 01_fda_imaging_endpoint_2018.pdf, section: "APPENDIX A", pages: [28]}
  evidence:
    - "must be retained for a period of no less than 2 years following approval of a marketing application or discontinuation of shipment and delivery of the drug for investigational use"
  answer_key: "판매 허가 신청 승인 후, 또는 임상시험용 의약품의 선적·배송 중단 후 최소 2년 (21 CFR 312.57(c), 312.62(c))."
  must_include: ["2"]

- id: p02
  type: factual
  lang: en
  question: "If readers interpret images in batches, what should the imaging charter specify according to the FDA guidance?"
  answerable: true
  expected_sources:
    - {file: 01_fda_imaging_endpoint_2018.pdf, section: "APPENDIX A", pages: [24]}
  evidence:
    - "If readers interpret images in batches, the size of the batches should be specified, and the batch size should be justified to minimize recall bias."
    - "The allowable time interval between the batch sessions also should be predefined."
  answer_key: "The batch size (justified to minimize recall bias) and the allowable time interval between batch sessions should be specified/predefined."
  must_include: ["recall bias"]

- id: p03
  type: cross_language
  lang: ko
  question: "판독자 간 불일치 조정(adjudication) 비율이 중요하다고 판단되면 FDA는 어떤 문서에 무엇을 미리 정하라고 하나요?"
  answerable: true
  expected_sources:
    - {file: 01_fda_imaging_endpoint_2018.pdf, section: "APPENDIX A", pages: [27]}
  evidence:
    - "if the image adjudication rate is regarded as an important consideration, then the trial documents (protocol and statistical analysis plan) should prespecify this rate determination process"
  answer_key: "임상시험 문서(프로토콜과 통계분석계획서)에 adjudication 비율 산출 절차를 사전에 명시한다."

- id: p04
  type: factual
  lang: en
  question: "Which kinds of image presentation to readers does the FDA imaging charter guidance describe?"
  answerable: true
  expected_sources:
    - {file: 01_fda_imaging_endpoint_2018.pdf, section: "APPENDIX A", pages: [21, 22]}
  evidence:
    - "In a time-sequential presentation, a subject"
    - "In the simultaneous image presentation, a subject"
    - "In a hybrid, randomized image presentation, a subject"
  answer_key: "Time-sequential, simultaneous, simultaneous randomized temporal, simultaneous time point, and hybrid randomized image presentation."

- id: p05
  type: cross_language
  lang: ko
  question: "무작위배정 대조 임상시험에서 1차 평가변수 영상 판독자는 무엇에 대해 눈가림되어야 한다고 FDA는 기대하나요?"
  answerable: true
  expected_sources:
    - {file: 01_fda_imaging_endpoint_2018.pdf, section: "C. Should Image Interpretation Be Blinded", pages: [7]}
  evidence:
    - "clinical trial primary endpoint image readers will be blinded to a subject"
    - "treatment assignment because knowing the assignment would be presumed to create bias"
  answer_key: "대상자의 치료군 배정(treatment assignment)에 대해 눈가림되어야 하며, 대부분은 개별 임상 정보도 모른 채 판독할 것으로 예상한다."

- id: p06
  type: factual
  lang: en
  question: "For what kind of trial endpoint does the FDA say existing medical-practice imaging standards may be reasonable? Give the examples."
  answerable: true
  expected_sources:
    - {file: 01_fda_imaging_endpoint_2018.pdf, section: "A. Are Existing Medical Practice", pages: [10]}
  evidence:
    - "existing medical practice imaging process standards may be reasonable for an endpoint focused upon the detection of a long bone fracture or intracranial hemorrhage"
  answer_key: "An indisputable outcome readily determined with widely implemented methods, e.g. detection of a long bone fracture or intracranial hemorrhage."
  must_include: ["fracture"]

- id: p07
  type: cross_language
  lang: ko
  question: "판독자 피로(reader fatigue)가 중요한 고려사항일 때 FDA는 charter에 무엇을 정하는 것을 고려하라고 하나요?"
  answerable: true
  expected_sources:
    - {file: 01_fda_imaging_endpoint_2018.pdf, section: "APPENDIX A", pages: [22]}
  evidence:
    - "The charter developers should consider whether to specify a maximum number of images to be read in a session if reader fatigue is an important consideration"
  answer_key: "한 세션에서 판독할 수 있는 최대 영상 수를 지정할지 고려한다."

- id: p08
  type: factual
  lang: en
  question: "What does 'locking data' mean in the FDA imaging charter guidance?"
  answerable: true
  expected_sources:
    - {file: 01_fda_imaging_endpoint_2018.pdf, section: "APPENDIX A", pages: [26]}
  evidence:
    - "Locking data means that no further modification of image assessment is allowed."
  answer_key: "No further modification of the image assessment is allowed after the lock."

- id: p09
  type: no_answer
  lang: ko
  question: "FDA 영상 평가변수 가이드라인이 요구하는 판독자 간 일치도(kappa)의 최소 기준값은 얼마인가요?"
  answerable: false

# --- 02 ICH E6(R3) ----------------------------------------------------------------------------
- id: p10
  type: cross_language
  lang: ko
  question: "ICH E6(R3)에 따르면 시험자는 어떤 경우에만 임상시험계획서에서 벗어날 수 있나요?"
  answerable: true
  expected_sources:
    - {file: 02_ich_e6r3_2025.pdf, section: "2.5 Compliance with Protocol", pages: [20]}
  evidence:
    - "The investigator should follow the protocol and deviate only where necessary to eliminate an immediate hazard(s) to trial participants."
  answer_key: "시험대상자에 대한 즉각적인 위험(immediate hazard)을 제거하기 위해 필요한 경우에만 벗어날 수 있고, 이 경우 의뢰자에게 신속히 알린다."

- id: p11
  type: factual
  lang: en
  question: "Under ICH E6(R3), for how long should the investigator/institution retain the essential records?"
  answerable: true
  expected_sources:
    - {file: 02_ich_e6r3_2025.pdf, section: "2.12 Records", pages: [30]}
  evidence:
    - "retain the essential records for the required retention period in accordance with applicable regulatory requirements or until the sponsor informs the investigator/institution that these records are no longer"
  answer_key: "For the retention period required by applicable regulatory requirements or until the sponsor says they are no longer needed, whichever is the longest."

- id: p12
  type: cross_language
  lang: ko
  question: "ICH E6(R3)에서 시험기관 모니터링 활동의 빈도는 무엇을 근거로 정하나요?"
  answerable: true
  expected_sources:
    - {file: 02_ich_e6r3_2025.pdf, section: "3.11.4.1 Investigator Site Monitoring", pages: [38]}
  evidence:
    - "The frequency of monitoring activities should also be determined based on identified risks."
  answer_key: "확인된 위험(identified risks)을 근거로 정하며, 얻은 지식에 따라 활동과 빈도를 조정한다."

- id: p13
  type: factual
  lang: en
  question: "According to ICH E6(R3), who should perform monitoring at a site?"
  answerable: true
  expected_sources:
    - {file: 02_ich_e6r3_2025.pdf, section: "3.11.4 Monitoring", pages: [37]}
  evidence:
    - "monitoring should be performed by persons not involved in the clinical conduct of the trial at the site being monitored"
  answer_key: "Persons who are not involved in the clinical conduct of the trial at the site being monitored."

- id: p14
  type: factual
  lang: en
  question: "In ICH E6(R3), how can centralised monitoring relate to site monitoring?"
  answerable: true
  expected_sources:
    - {file: 02_ich_e6r3_2025.pdf, section: "3.11.4.2 Centralised Monitoring", pages: [38]}
  evidence:
    - "Centralised monitoring processes provide additional monitoring capabilities that can complement and reduce the extent and/or frequency of site monitoring or be used on its own."
  answer_key: "It can complement and reduce the extent and/or frequency of site monitoring, or be used on its own."

- id: p15
  type: cross_language
  lang: ko
  question: "ICH E6(R3)에서 임상시험이 조기 종료되거나 중지되면 시험자/시험기관은 무엇을 해야 하나요?"
  answerable: true
  expected_sources:
    - {file: 02_ich_e6r3_2025.pdf, section: "2.6 Premature Termination or Suspension", pages: [21]}
  evidence:
    - "should promptly inform the trial participants and should ensure appropriate therapy and follow-up for the participants"
  answer_key: "시험대상자에게 신속히 알리고 적절한 치료와 추적관찰을 보장해야 한다."

- id: p16
  type: cross_language
  lang: ko
  question: "ICH E6(R3)에서 IRB/IEC는 최소 몇 명의 위원으로 구성되어야 하나요?"
  answerable: true
  expected_sources:
    - {file: 02_ich_e6r3_2025.pdf, section: "1.3 Composition, Functions and Operations", pages: [16]}
  evidence:
    - "(a) At least five members;"
  answer_key: "최소 5명."
  must_include: ["5"]

# --- 03 EMA anticancer guideline Rev.6 --------------------------------------------------------
- id: p17
  type: factual
  lang: en
  question: "According to the EMA anticancer guideline, how should ORR be documented in phase II single-agent studies of cytotoxic compounds?"
  answerable: true
  expected_sources:
    - {file: 03_ema_anticancer_rev6.pdf, section: "6.1.2.4 Evaluation of activity", pages: [12]}
  evidence:
    - "ORR should be documented according to international standards (e.g. RECIST, Volumetric RECIST or WHO criteria)."
  answer_key: "According to international standards such as RECIST, Volumetric RECIST or WHO criteria (modifications justified); ITT principle applies and external independent review is encouraged."
  must_include: ["RECIST"]

- id: p18
  type: cross_doc
  lang: ko
  question: "MTD(최대내약용량)를 전통적으로 어떻게 정의하는지 식약처 항암제 가이드라인과 EMA 가이드라인에서 각각 확인해 주세요."
  answerable: true
  expected_sources:
    - {file: 03_ema_anticancer_rev6.pdf, section: "10 Definitions", pages: [42]}
    - {file: 04_mfds_anticancer_guideline_ko.pdf, section: "용어 정의", pages: [46]}
  evidence:
    - "the MTD has traditionally often been defined by dose-limiting toxicity occurring in at least 2 of 6 patients"
    - "일반적으로 6명의 시험대상자 중 적어도 2명에서 용량제한독성(DLT)이 나타나는 용량으로 정의"
  answer_key: "두 문서 모두 6명 중 적어도 2명에서 용량제한독성(DLT)이 나타나는 용량(그 이상 증량하지 않음)으로 정의한다."

- id: p19
  type: factual
  lang: en
  question: "Why does the EMA guideline advise intravenous administration in first-in-man studies?"
  answerable: true
  expected_sources:
    - {file: 03_ema_anticancer_rev6.pdf, section: "6.1.1.3 Dose and schedules", pages: [10]}
  evidence:
    - "intravenous administration, when feasible, is advisable for first use in man studies since it eliminates variability related to bioavailability"
  answer_key: "Because IV administration eliminates variability related to bioavailability."
  must_include: ["bioavailability"]

- id: p20
  type: cross_language
  lang: ko
  question: "EMA 가이드라인에서 이전 치료의 TTP와 시험약의 PFS를 비교하는 환자 내 외부 대조 분석을 더 설득력 있게 만드는 방법은?"
  answerable: true
  expected_sources:
    - {file: 03_ema_anticancer_rev6.pdf, section: "8.1.3 Use of external control", pages: [33]}
  evidence:
    - "The analysis will be more convincing if progression on both prior and experimental therapy is independently adjudicated, e.g., using blinded independent central review."
  answer_key: "이전 치료와 시험 치료 모두에서의 진행을 독립적으로 판정(예: 맹검 독립 중앙 판독, BICR)하면 더 설득력이 있다."

- id: p21
  type: factual
  lang: en
  question: "What does the EMA guideline say about the scientific support for BSA-scaled dosing?"
  answerable: true
  expected_sources:
    - {file: 03_ema_anticancer_rev6.pdf, section: "6.1.1.3 Dose and schedules", pages: [10]}
  evidence:
    - "The scientific support for the notion that BSA scaled dosing generally reduces inter-patient variability in exposure is weak"
  answer_key: "Support is weak; it may lead to over- and under-exposure in patients with high and low BSA, and the role of BSA/weight should be explored by modelling and simulation."

