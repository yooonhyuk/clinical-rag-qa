- id: p77
  type: table_lookup
  lang: en
  question: "What does the Basic Profile do with Study Instance UID (0020,000D), and what changes with the Retain UIDs Option?"
  answerable: true
  expected_sources:
    - {file: 11_dicom_ps3.15_annexE_2026d.html, section: "Table E.1-1.", pages: []}
  evidence:
    - "Attribute Name: Study Instance UID; Tag: (0020,000D); Retd. (from PS3.6): N; In Std. Comp. IOD (from PS3.3): Y; Basic Prof.: U; Rtn. UIDs Opt.: K"
  answer_key: "Basic Profile: U (replace with a non-zero length UID that is internally consistent within a set of instances); Retain UIDs Option: K (keep)."
