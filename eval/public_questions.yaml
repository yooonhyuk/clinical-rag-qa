# --- 10 MIDI de-identification report (arXiv 2303.10473, CC BY) -------------------------------
- id: p72
  type: cross_language
  lang: ko
  question: "MIDI 보고서는 DICOM 영상 비식별화 시 어떤 표준 프로파일을 기준으로 삼으라고 권고하나요?"
  answerable: true
  expected_sources:
    - {file: 10_midi_deid_report_2023.pdf, section: "1.6 Summary of Best Practices", pages: [8]}
  evidence:
    - "the current release (at the time of de-identification) of the DICOM PS3.15 E.1 Application Level Confidentiality Profile should be used as a reference"
  answer_key: "비식별화 시점의 최신 DICOM PS3.15 E.1 Application Level Confidentiality Profile을 기준으로 하고, private 등 다른 위험 속성 지식으로 보완한다."
  must_include: ["PS3.15"]

- id: p73
  type: factual
  lang: en
  question: "Does the MIDI report accept retaining a fixed number of indirect identifiers without a risk analysis?"
  answerable: true
  expected_sources:
    - {file: 10_midi_deid_report_2023.pdf, section: "1.6 Summary of Best Practices", pages: [9]}
  evidence:
    - "No arbitrary finite number or specified subset of indirect identifiers is considered acceptable to retain in the absence of a risk analysis."
  answer_key: "No. No arbitrary number or subset of indirect identifiers is acceptable to retain without a collection-specific risk analysis."

- id: p74
  type: cross_language
  lang: ko
  question: "MIDI 보고서가 범위 밖(out of scope)으로 둔 원시 데이터(raw data)의 예는 무엇인가요?"
  answerable: true
  expected_sources:
    - {file: 10_midi_deid_report_2023.pdf, section: "1.5 Summary of Scope", pages: [7]}
  evidence:
    - "Raw data, including MR k-space, CT projections, and PET list mode data"
  answer_key: "MR k-space, CT projection, PET list mode 데이터 같은 원시 데이터."

- id: p75
  type: cross_doc
  lang: ko
  question: "비식별화 후 DICOM IOD 적합성 유지에 대해 MIDI 보고서와 DICOM PS3.15 Annex E 표는 각각 어떻게 말하나요?"
  answerable: true
  expected_sources:
    - {file: 10_midi_deid_report_2023.pdf, section: "1.6 Summary of Best Practices", pages: [8]}
    - {file: 11_dicom_ps3.15_annexE_2026d.html, section: "Table E.1-1a", pages: []}
  evidence:
    - "de-identification of DICOM files should retain DICOM conformance with the original information object definition (IOD), even if that requires synthesis of dummy values for replacement"
    - "Z/D | Z unless D is required to maintain IOD conformance (Type 2 versus Type 1)"
  answer_key: "MIDI는 더미 값을 만들어서라도 원래 IOD 적합성을 유지하라고 하고, PS3.15는 Z/D처럼 IOD 적합성 유지에 필요하면 더미 값(D)으로 대체하는 조합 코드를 둔다."

# --- 11 DICOM PS3.15 Annex E (2026d) ----------------------------------------------------------
- id: p76
  type: table_lookup
  lang: ko
