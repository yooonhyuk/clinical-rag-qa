  evidence:
    - "Attribute Name: Study Date; Tag: (0008,0020); Retd. (from PS3.6): N; In Std. Comp. IOD (from PS3.3): Y; Basic Prof.: Z; Rtn. Long. Full Dates Opt.: K; Rtn. Long. Modif. Dates Opt.: C"
