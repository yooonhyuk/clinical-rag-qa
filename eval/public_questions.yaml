  answerable: true
  expected_sources:
    - {file: 11_dicom_ps3.15_annexE_2026d.html, section: "Table E.1-1.", pages: []}
  evidence:
    - "Attribute Name: Institution Name; Tag: (0008,0080); Retd. (from PS3.6): N; In Std. Comp. IOD (from PS3.3): Y; Basic Prof.: X/Z/D; Rtn. Inst. Id. Opt.: K"
  answer_key: "X/Z/D (remove unless Z or D is needed for IOD conformance); K with the Retain Institution Identity Option."
