[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
pythonpath = backend eval scripts
markers =
    integration: needs PostgreSQL + pgvector (testcontainers or TEST_DATABASE_URL)
filterwarnings =
    ignore::DeprecationWarning:testcontainers.*
    ignore:builtin type .* has no __module__ attribute:DeprecationWarning
